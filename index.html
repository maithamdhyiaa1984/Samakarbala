<style>
:root{
 --bg:#07101c;--bg2:#0a1422;--panel:#0f1b2d;--panel2:#132238;--panel3:#172941;
 --line:#243851;--text:#edf4ff;--mut:#8ea2bd;--mut2:#667d9c;
 --teal:#35d0b2;--cyan:#4ab7ed;--gold:#f2b84b;--vio:#9d86f2;--coral:#ff7588;--orange:#ff9a61;--good:#35d0b2;--bad:#ff6479;
 --shadow:0 18px 60px rgba(0,0,0,.28);--radius:18px;--radius2:13px;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% -10%,rgba(74,183,237,.12),transparent 32%),radial-gradient(circle at 15% 15%,rgba(53,208,178,.08),transparent 26%),var(--bg);color:var(--text);font-family:"Noto Sans Arabic","Inter",system-ui,sans-serif;font-size:14px;line-height:1.55;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}.ltr{direction:ltr}.num{font-family:"Inter",sans-serif;font-variant-numeric:tabular-nums}.hidden{display:none!important}
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:100;height:64px;border-bottom:1px solid rgba(142,162,189,.14);background:rgba(7,16,28,.86);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:16px}
.brand{display:flex;align-items:center;gap:11px;min-width:280px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#15263d,#203956);border:1px solid #34516e;display:grid;place-items:center;font-size:20px;box-shadow:inset 0 0 22px rgba(74,183,237,.12)}.brand b{font-size:15px}.brand small{display:block;color:var(--mut);font-size:10px;margin-top:1px}.top-actions{display:flex;align-items:center;gap:8px}.ghost{border:1px solid var(--line);background:#0c1726;color:var(--text);border-radius:10px;padding:7px 10px}.ghost:hover{border-color:#3f5f80;background:#112036}.sync{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:11px}.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 12px rgba(53,208,178,.6)}
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:calc(100vh - 64px)}.side{position:sticky;top:64px;height:calc(100vh - 64px);border-inline-end:1px solid rgba(142,162,189,.13);background:rgba(8,18,31,.74);padding:16px 12px;overflow:auto}.nav-title{color:var(--mut2);font-size:10px;font-weight:800;letter-spacing:.08em;padding:8px 10px 6px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{width:100%;border:0;background:transparent;color:#9eb0c8;text-align:start;border-radius:11px;padding:10px 11px;display:flex;align-items:center;gap:10px;font-weight:700}.nav button:hover{background:#101e31;color:#fff}.nav button.on{background:linear-gradient(90deg,rgba(53,208,178,.13),rgba(74,183,237,.07));color:#fff;border:1px solid rgba(53,208,178,.22)}.nav-icon{width:28px;height:28px;border-radius:8px;background:#12243a;border:1px solid #223a57;display:grid;place-items:center;font-size:12px}.nav button.on .nav-icon{background:#14342f;border-color:#256d61;color:var(--teal)}
.main{min-width:0;padding:18px 20px 50px}.filterbar{position:sticky;top:64px;z-index:90;background:rgba(7,16,28,.91);backdrop-filter:blur(15px);border:1px solid rgba(142,162,189,.15);border-radius:15px;padding:10px 12px;margin-bottom:14px;box-shadow:0 8px 26px rgba(0,0,0,.16)}.filters{display:grid;grid-template-columns:repeat(6,minmax(125px,1fr));gap:8px;align-items:end}.field label{display:block;color:var(--mut);font-size:9px;font-weight:700;margin-bottom:4px}.field input,.field select{width:100%;height:38px;border-radius:9px;border:1px solid var(--line);background:#0d1929;color:var(--text);padding:0 9px;outline:none}.field input:focus,.field select:focus{border-color:#3c7192;box-shadow:0 0 0 3px rgba(74,183,237,.08)}.filter-actions{display:flex;gap:6px}.filter-actions .ghost{height:38px;flex:1}
.hero{position:relative;overflow:hidden;border:1px solid rgba(74,183,237,.2);background:linear-gradient(125deg,rgba(18,38,61,.94),rgba(10,25,42,.95));border-radius:22px;padding:23px 24px;margin-bottom:14px;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;inset:auto -50px -90px auto;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle,rgba(53,208,178,.16),transparent 68%)}.hero-row{display:flex;justify-content:space-between;gap:20px;align-items:center;position:relative;z-index:2}.eyebrow{color:var(--cyan);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.hero h1{font-size:26px;margin:4px 0 4px;line-height:1.25}.hero p{margin:0;color:#aabbd0;max-width:880px;font-size:12px}.version{padding:6px 10px;border-radius:999px;background:rgba(242,184,75,.11);border:1px solid rgba(242,184,75,.3);color:var(--gold);font-size:10px;font-weight:800;white-space:nowrap}
.stage-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:14px}.stage-card{background:linear-gradient(145deg,#101d30,#0d1929);border:1px solid var(--line);border-radius:16px;padding:15px;position:relative;overflow:hidden;min-height:168px;box-shadow:0 10px 30px rgba(0,0,0,.13);cursor:pointer;transition:.18s}.stage-card:hover{transform:translateY(-2px);border-color:#3b5d7e}.stage-card:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent,var(--cyan))}.stage-top{display:flex;justify-content:space-between;align-items:center}.stage-code{color:var(--accent);font:800 11px "Inter";letter-spacing:.08em}.stage-status{font-size:9px;color:var(--mut);display:flex;align-items:center;gap:4px}.stage-status i{width:6px;height:6px;border-radius:50%;background:var(--good)}.stage-card h3{margin:10px 0 0;font-size:16px}.stage-card .primary{font:800 28px "Inter";margin-top:9px;letter-spacing:-.02em}.stage-card .label{color:var(--mut);font-size:10px;margin-top:1px}.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:10px}.mini{background:#0a1726;border:1px solid rgba(142,162,189,.1);border-radius:8px;padding:6px 7px}.mini b{font:700 12px "Inter"}.mini span{display:block;color:var(--mut);font-size:8px;margin-top:1px}
.section{background:linear-gradient(145deg,rgba(15,27,45,.97),rgba(11,23,38,.97));border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:0 14px 34px rgba(0,0,0,.12)}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.section-head h2{margin:0;font-size:16px}.section-head p{margin:3px 0 0;color:var(--mut);font-size:10px}.section-tag{border:1px solid var(--line);background:#0d1929;color:var(--mut);border-radius:999px;padding:5px 8px;font:700 9px "Inter";white-space:nowrap}.section-nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.section-nav a{color:#aabbd0;text-decoration:none;background:#0c1828;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:9px;font-weight:700}.section-nav a:hover{color:#fff;border-color:#3d5e7f}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.kpi{position:relative;overflow:hidden;background:linear-gradient(145deg,#14233a,#101c2e);border:1px solid #263b56;border-radius:14px;padding:12px 13px;min-height:108px}.kpi:after{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--accent,var(--cyan));opacity:.9}.kpi .k-label{color:#92a6c0;font-size:9px;font-weight:700;min-height:27px}.kpi .k-val{font:800 22px "Inter";margin-top:6px;white-space:nowrap}.kpi .k-sub{color:var(--mut);font-size:8px;margin-top:4px}.kpi .good{color:var(--good)}.kpi .bad{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:#0f1b2d;border:1px solid #243852;border-radius:14px;padding:12px;min-width:0}.card h3,.card h4{margin:0;font-size:13px}.card .sub{color:var(--mut);font-size:9px;margin:3px 0 8px}.chartbox{position:relative;height:310px}.chartbox.sm{height:245px}.chartbox.lg{height:365px}.chartbox canvas{width:100%!important;height:100%!important}

/* PSR sex-specific depletion limits preserved from V13.2.
   Ross publishes overall rearing liveability (95–96%) but not a weekly sex-specific mort/cull split,
   therefore these four component limits are labelled INTERNAL operational standards, not Ross objectives. */
const V1110_PSR_DEP_STD={fMort:3,fCull:2,mMort:4,mCull:6,endWk:24};
function v1110PsrDepStd(kind,w){const cap=V1110_PSR_DEP_STD[kind];if(cap==null)return null;const frac=Math.max(0,Math.min(1,(+w||0)/V1110_PSR_DEP_STD.endWk));return cap*frac;}
function v1110LowBetterAch(actualPct,stdPct){if(actualPct==null||stdPct==null)return null;if(actualPct<=stdPct)return 100;if(actualPct<=0)return 100;if(stdPct<=0)return 0;return Math.max(0,Math.min(100,100*stdPct/actualPct));}

function v117LatestPer(rows,keyFn,asISO){const m=new Map();rows.filter(x=>!asISO||iso(x.date)<=asISO).forEach(x=>{const k=keyFn(x),old=m.get(k);if(!old||x.date>old.date)m.set(k,x)});return [...m.values()]}

 const fl=v117LatestPer(D.gp,x=>x.farm+'|'+x.flock+'|'+x.line,asISO).filter(x=>/active/i.test(x.status)&&x.fEnd>0);let te=0,he=0;
 for(let d=v117MonthStart(ym),e=v117MonthEnd(ym);d<=e;d=addDays(d,1))for(const x of fl){const age=x.ageW+(dayDiff(x.date,d)||0)/7,st=gpStdAt(age,x.line);if(st){te+=x.fEnd*st.te/100;he+=x.fEnd*st.he/100}}

function v117PsStd(w,i){w=Math.round(+w||0);if(w<25||w>70)return null;if(w<=64)return v11PSstd(w,i);const a=v11PSstd(60,i),b=v11PSstd(64,i);if(a==null||b==null)return null;const v=b+(b-a)/4*(w-64);return i===0?Math.max(0,Math.min(100,v)):Math.max(0,v)}

function v117TrailingRate(rows,dateField,valFn,asISO,days=28){const end=parseDate(asISO),start=addDays(end,-days+1);let tot=0;rows.forEach(x=>{const d=x[dateField];if(d&&d>=start&&d<=end)tot+=valFn(x)||0});return tot/days}

function v117BrhRates(D,asISO){return{set:v117TrailingRate(D.brh,'date',x=>x.set,asISO),disposal:v117TrailingRate(D.brh,'date',x=>x.disposal,asISO),sales:v117TrailingRate(D.brh,'date',x=>x.salesEgg+x.salesCull,asISO)}}
function v117RecentSaleableRate(D,asISO){const z=D.brh.filter(x=>iso(x.date)<=asISO&&x.linkedSet>0&&x.saleable>0).sort((a,b)=>b.date-a.date).slice(0,40);return safeDiv(sum(z,x=>x.saleable),sum(z,x=>x.linkedSet))||.80}
function v117RecentGphHatchRate(D,asISO){const z=D.gph.rows.filter(x=>x.hatchDate&&iso(x.hatchDate)<=asISO&&x.linkedSet>0).sort((a,b)=>b.hatchDate-a.hatchDate).slice(0,30);return safeDiv(sum(z,x=>x.hatchedF+x.hatchedM),sum(z,x=>x.linkedSet))||.75}
function v117WeeklyMapFromDaily(map,ym){const out=[...group(Object.entries(map).filter(([d])=>d.startsWith(ym)),x=>weekStart(x[0])).entries()].map(([w,rs])=>({week:w,value:sum(rs,x=>x[1])})).sort((a,b)=>a.week.localeCompare(b.week));return out}
function v117RecordedFutureSet(rows,ym,kind){const map={};rows.filter(x=>v117InYM(x.date,ym)).forEach(x=>{const v=kind==='gph'?x.setF+x.setM:x.set;map[iso(x.date)]=(map[iso(x.date)]||0)+v});return map}
function v117ForecastWeeklySet(rows,ym,kind,rate){const rec=v117RecordedFutureSet(rows,ym,kind),has=sum(Object.values(rec))>0;if(has)return{weekly:v117WeeklyMapFromDaily(rec,ym),total:sum(Object.values(rec)),basis:'recorded'};const map={};for(let d=v117MonthStart(ym),e=v117MonthEnd(ym);d<=e;d=addDays(d,1))map[iso(d)]=rate;return{weekly:v117WeeklyMapFromDaily(map,ym),total:rate*v117Days(ym),basis:'forecast'} }

 const pp=v117LatestPer(D.ps.p,x=>x.farm+'|'+x.flock,asISO);pp.forEach(x=>{const wk=(x.age||0)/7,dd=Math.ceil((70-wk)*7),d=addDays(x.date,dd),st=endOfDayStock(x);if(d&&v117YM(d)===ym)ev.push({project:'PSP',date:iso(d),ref:x.farm+' / '+x.flock,head:st.f+st.m})});return ev.sort((a,b)=>a.date.localeCompare(b.date));

function v117MonthForecast(D,ym,asISO){

function v117MgmtIssues(actual,fc){const out=[];if(actual?.bro?.dep!=null&&actual.bro.dep>.06)out.push([T('مزارع التسمين','Broilers'),T('الاستبعاد أعلى من 6%','Depletion above 6%'),pct(actual.bro.dep),T('مراجعة المزارع/الحضائر الأعلى انحرافاً','Review highest-deviation farms/houses')]);if(actual?.bro?.fcr&&actual.bro.fcr>1.6)out.push([T('مزارع التسمين','Broilers'),'FCR '+T('مرتفع','high'),fmt(actual.bro.fcr,3),T('مراجعة العلف والوزن وعمر الذبح','Review feed, weight and slaughter age')]);if(actual?.brh?.hatch!=null&&actual.brh.hatch<.80)out.push([T('مفاقس التسمين','Broiler Hatcheries'),T('Hatchability أقل من 80%','Hatchability below 80%'),pct(actual.brh.hatch),T('تحليل الإيداعات ونتائج الفقس المتاحة','Review setting and hatch results')]);if(fc&&fc.kill.coverage<.95)out.push([T('التسمين/المجزر','Broiler / Plant'),T('تغطية بيانات التسكين غير مكتملة للشهر القادم','Placement coverage incomplete for month-ahead kill'),pct(fc.kill.coverage),T('استكمال التسكينات المطلوبة حتى ','Complete placements through ')+fc.kill.requiredEnd]);return out}

<script id="v121-comprehensive-audit-fix">
/* V1.1.21 · Comprehensive audit fixes
   - Chunked Cumulative-data live loader for large Google Sheet
   - Final version/header consistency guard
   - Keeps standalone file:// compatibility through GViz JSONP (no fetch/CORS dependency)
*/
(function(){
 'use strict';
 const V121='V1.1.21';
 try{CFG.version=V121}catch(e){}

 function v121ApplyVersion(){
  try{
   document.title='Sama Karbala — Poultry Command Center '+V121;
   const s=document.getElementById('brandSub');
   if(s)s.textContent=T('منصة مستقلة · Live Google Sheets · '+V121,'Independent platform · Live Google Sheets · '+V121);
   document.querySelectorAll('.version').forEach(el=>{if(/NEW CORE/i.test(el.textContent||''))el.textContent='NEW CORE · '+V121});
  }catch(e){}
 }
 const _v121Hero=hero;
 hero=function(title,sub,eyebrow='POULTRY COMMAND CENTER'){
  return _v121Hero(title,sub,eyebrow).replace(/NEW CORE · V1\.1\.\d+/g,'NEW CORE · '+V121);
 };
 const _v121SetLang=setLang;
 setLang=function(){const r=_v121SetLang();v121ApplyVersion();setTimeout(v121ApplyVersion,0);return r};

 function v121CumChunk(d,key,limit,offset){
  return new Promise((resolve,reject)=>{
   const cb='__SK_CUM_'+offset+'_'+Date.now()+'_'+Math.random().toString(36).slice(2);
   const sc=document.createElement('script');let done=false;
   const cleanup=()=>{try{delete window[cb]}catch(_){window[cb]=undefined}try{sc.remove()}catch(_){}};
   const timer=setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error('Cumulative data chunk timeout @ '+offset));},45000);
   window[cb]=(resp)=>{if(done)return;done=true;clearTimeout(timer);try{const raw=gvizToRaw(resp,d);cleanup();resolve(raw)}catch(e){cleanup();reject(e)}};
   sc.async=true;sc.referrerPolicy='strict-origin-when-cross-origin';
   sc.onerror=()=>{if(done)return;done=true;clearTimeout(timer);cleanup();reject(new Error('Unable to load Cumulative data chunk @ '+offset))};
   const q=new URLSearchParams();
   q.set('sheet',d.sheet);q.set('headers','1');q.set('range','A1:S');
   q.set('tq','select A,B,C,D,E,F,G,H,I,J,K,L,M,N,O,P,Q,R,S limit '+limit+' offset '+offset);
   q.set('tqx','out:json;responseHandler:'+cb);q.set('_',String(Date.now()));
   sc.src='https://docs.google.com/spreadsheets/d/'+d.id+'/gviz/tq?'+q.toString();
   document.head.appendChild(sc);
  });
 }
 async function v121LoadCumRaw(force=false){
  const key='bCum',d=CFG.sheets[key];
  if(!d)throw new Error('Cumulative data source is not configured');
  if(!force&&S.raw.has(key))return S.raw.get(key);
  S.sourceState.set(key,'loading');updateSync();
  try{
   const limit=3500,all=[];let headers=null;
   for(let offset=0;offset<28000;offset+=limit){
    let raw;
    try{raw=await v121CumChunk(d,key,limit,offset)}
    catch(first){await new Promise(r=>setTimeout(r,700));raw=await v121CumChunk(d,key,limit,offset)}
    if(!headers&&Array.isArray(raw.__headers))headers=raw.__headers.slice();
    all.push(...raw);
    if(raw.length<limit)break;
   }
   if(headers)all.__headers=headers;
   if(!all.length)throw new Error('Cumulative data returned no rows');
   S.raw.set(key,all);S.sourceState.set(key,'ok');updateSync();return all;
  }catch(e){S.raw.delete(key);S.sourceState.set(key,'error');updateSync();throw e}
 }
 const _v121FetchRaw=fetchRaw;
 fetchRaw=async function(key,force=false){
  if(key==='bCum')return v121LoadCumRaw(force);
  return _v121FetchRaw(key,force);
 };

  return m;
 };

 v121ApplyVersion();
 setTimeout(v121ApplyVersion,1300);
 setTimeout(v121ApplyVersion,2600);
})();
